name: SonarQube Cloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install ReportGenerator
        run: dotnet tool install --tool-path "${{ runner.temp }}/tequio-tools" dotnet-reportgenerator-globaltool --version 5.6.1

      - name: Begin SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/tequio-tools" dotnet-sonarscanner --version 12.1.0
          "$RUNNER_TEMP/tequio-tools/dotnet-sonarscanner" begin \
            /k:"SweetBlue16_TequioAPI" \
            /o:"ioexception-team" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml"

      - name: Build solution
        run: dotnet build backend/Tequio.slnx --no-incremental

      - name: Run xUnit tests with coverage
        run: |
          dotnet test backend/Tequio.slnx --no-build \
            --collect:"XPlat Code Coverage" --logger trx \
            --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Generate HTML coverage
        run: |
          "$RUNNER_TEMP/tequio-tools/reportgenerator" \
            "-reports:TestResults/**/coverage.opencover.xml" \
            "-targetdir:TestResults/coverage" "-reporttypes:Html;TextSummary"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xunit-coverage
          path: TestResults/

      - name: End SonarQube Cloud analysis
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: '"$RUNNER_TEMP/tequio-tools/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"'
